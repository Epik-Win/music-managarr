# MusicAI's metadata lookups (lyrics, tags, cover art, fingerprints) leave
# through this proxy instead of the VPN. Publish no port: only containers on
# the same Docker network can use it.
User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 64
LogLevel Warning
DisableViaHeader Yes
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
ConnectPort 443
ConnectPort 80
